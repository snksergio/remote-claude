ayPjSocioNovo","Novo sócio · aba Empresa"],["PayPjSocioPj","Sócio empresa"]],"regras":["Na folha \"Novo sócio\", toque em Empresa.","\"Mesmo endereço da empresa\" desligado mostra CEP e número."]},{"grupo":"Casos da empresa","id":"semAdm","nome":"Falta sócio administrador","desc":"Ninguém marcado como administrador: o aviso fica âmbar e o botão espera.","passos":[["PayPjSociosSemAdm","Sócios sem administrador"],["PayPjSocioPf","Marcar \"É administrador(a)\""],["PayPjSocios","Regra cumprida"]],"regras":["Toque num sócio, ligue \"É administrador(a)\" e salve.","Salvando sem ligar, a lista continua sem administrador."]},{"grupo":"Casos da empresa","id":"jaTem","nome":"CNPJ que já tem conta Pay","desc":"Cada CNPJ tem uma conta só. Regra a confirmar com o time.","passos":[["PayTitularCnpj","CNPJ da empresa"],["PayJaTemConta","Já tem conta Pay"]],"regras":["Quem administra a conta não aparece, por segurança."]},{"grupo":"Variações","id":"semDados","nome":"Sem usar os dados do app","desc":"Com \"Usar meus dados do app\" desligado, a etapa 1 vem em branco.","passos":[["PayTitularCpf","CPF do titular"],["PayPfDados","Seus dados em branco"]],"semDados":true,"regras":["O CPF continua travado: é o do titular."]}];
const $ = s => document.querySelector(s);

// sheets of the app and the screen they open over
const FOLHAS_APP = { PayPfEnderecoEditar: 'PayPfEndereco', PayPjSocioNovo: 'PayPjSocios' };
const estado = { fluxo: 0, tela: null, folha: null, pilha: [], usarDados: true };

let timers = [];
const limpaTimers = () => { timers.forEach(clearTimeout); timers = []; };

// ---------- scale the phone to the window (same rule as the login prototype)
const ajusta = () => {
  const w = 390, largo = innerWidth > 980;
  const s = Math.min(1, (innerHeight - 32 - 12 - 104) / 868, (innerWidth - (largo ? 32 + 600 + 2 * Math.min(64, Math.max(28, innerWidth * 0.04)) : 32)) / (w + 24));
  document.documentElement.style.setProperty('--s', Math.max(0.45, s).toFixed(3));
};
addEventListener('resize', ajusta); ajusta();

// ---------- left: the flows
const fluxosEl = $('#fluxos');
const desenhaFluxos = () => {
  let html = '', grupo = '';
  FLUXOS.forEach((f, i) => {
    if (f.grupo !== grupo) { if (grupo) html += '</div>'; grupo = f.grupo; html += '<div class="grupo">' + grupo + '</div><div class="lista-fluxos">'; }
    html += '<button class="fluxo" data-fluxo="' + i + '" aria-current="' + (i === estado.fluxo) + '"><span class="num">' + (i + 1) + '</span>' + f.nome + '</button>';
  });
  fluxosEl.innerHTML = html + '</div>';
};
fluxosEl.addEventListener('click', e => { const b = e.target.closest('[data-fluxo]'); if (b) comecaFluxo(+b.dataset.fluxo); });

// ---------- right: the screens of the flow
const painel = $('#telas-fluxo');
const passoAtual = () => { const f = FLUXOS[estado.fluxo], a = atual(); const t = f.passos.some(p => p[0] === a) ? a : ((f.filhas && f.filhas[a]) || estado.tela); return f.passos.findIndex(p => p[0] === t); };
const desenhaPainel = () => {
  const f = FLUXOS[estado.fluxo], at = passoAtual();
  painel.innerHTML = '<h2>' + f.nome + '</h2><p class="desc">' + f.desc + '</p><ol class="passos">' + f.passos.map((p, i) => '<li><button class="passo" data-passo="' + i + '"' + (i === at ? ' aria-current="step"' : '') + '><span class="n">' + (i + 1) + '</span>' + p[1] + '</button></li>').join('') + '</ol>'
    + (f.regras ? '<div class="regras"><b>O que observar</b><ul>' + f.regras.map(r => '<li>' + r + '</li>').join('') + '</ul></div>' : '')
    + '<p class="rodape-nota">Dados fictícios. Toque nos botões, campos, chips e switches do celular.</p>';
};
painel.addEventListener('click', e => { const b = e.target.closest('[data-passo]'); if (b) ir(FLUXOS[estado.fluxo].passos[+b.dataset.passo][0], { pilha: false }); });

// ---------- simulate buttons under the phone, per screen
const SIMULAR = {
  PaySelfieCamera: [['replay', 'Repetir a leitura', () => ir('PaySelfieCamera', { pilha: false })]],
  PayTitularCpf: [['person_off', 'Não usar meus dados', () => alternaSwitch('Usar meus dados do app')]],
  PayTitularCnpj: [['domain_disabled', 'CNPJ que já tem conta', () => ir('PayJaTemConta')]],
  PayPfDados: [['check_box', 'Mãe não consta', () => { const c = telasEl.querySelector('.pc-check'); if (c) c.click(); }]],
  PayPfPerfil: [['public', 'Não sou brasileiro(a)', () => alternaSwitch('Sou brasileiro(a)')], ['account_balance', 'Tenho cargo público', () => alternaSwitch('Tenho cargo público')]],
  PayPjSocios: [['person_remove', 'Sem administrador', () => ir('PayPjSociosSemAdm', { pilha: false })]],
  PayPjSociosSemAdm: [['how_to_reg', 'Com administrador', () => ir('PayPjSocios', { pilha: false })]],
  PayPjSocioPf: [['work', 'Marcar administrador(a)', () => alternaSwitch('É administrador(a)')]],
};
const simularEl = $('#simular');
const desenhaSimular = () => {
  const extra = estado.folha ? [] : (SIMULAR[estado.tela] || []);
  simularEl.innerHTML = '<span class="rot">Simular</span>' + extra.map(([ic, t], i) => '<button data-sim="' + i + '"><span class="ms">' + ic + '</span>' + t + '</button>').join('')
    + '<button data-sim="voltar"><span class="ms">arrow_back</span>Voltar</button><button data-sim="reinicia"><span class="ms">restart_alt</span>Recomeçar o fluxo</button>';
};
simularEl.addEventListener('click', e => {
  const b = e.target.closest('[data-sim]'); if (!b) return;
  if (b.dataset.sim === 'reinicia') return comecaFluxo(estado.fluxo);
  if (b.dataset.sim === 'voltar') return voltar();
  SIMULAR[estado.tela][+b.dataset.sim][2]();
});

// ---------- navigation
const comecaFluxo = i => {
  estado.fluxo = i; estado.pilha = []; estado.usarDados = !FLUXOS[i].semDados;
  desenhaFluxos(); ir(FLUXOS[i].passos[0][0], { pilha: false });
};
const voltar = () => { if (estado.folha) return fechaSheet(); const ant = estado.pilha.pop(); if (ant) ir(ant, { pilha: false, volta: true }); else toast('Esta é a primeira tela do fluxo.'); };
const marcaHash = () => history.replaceState(null, '', '#' + FLUXOS[estado.fluxo].id + '/' + atual());
// a sheet slides up over its screen (opening that screen first when it is not the one showing)
const abreSheet = nome => {
  const pai = FOLHAS_APP[nome];
  if (estado.tela !== pai) ir(pai, { pilha: estado.tela !== null });
  estado.folha = nome;
  appEl.innerHTML = TELAS[nome].corpo;
  appEl.classList.add('aberta');
  appEl.querySelectorAll('select.pc-input').forEach(s => { const f = () => s.classList.toggle('vazio', !s.value); f(); s.addEventListener('change', f); });
  // slide up from the bottom while the dim layer fades in
  const dlg = appEl.querySelector('[role="dialog"]'), veu = appEl.firstElementChild;
  if (dlg) dlg.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], { duration: 360, easing: 'cubic-bezier(.2,.8,.2,1)' });
  if (veu) veu.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease-out' });
  desenhaPainel(); desenhaSimular(); marcaHash();
};
const fechaSheet = (instantaneo = false) => {
  if (!estado.folha) return;
  estado.folha = null;
  const dlg = appEl.querySelector('[role="dialog"]'), veu = appEl.firstElementChild;
  const limpa = () => { if (!estado.folha) { appEl.classList.remove('aberta'); appEl.innerHTML = ''; } };
  if (instantaneo || !dlg) limpa();
  else {
    // slide back down, then clear; taps go through right away
    appEl.classList.remove('aberta');
    if (veu) veu.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: 'ease-in', fill: 'forwards' });
    dlg.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }], { duration: 280, easing: 'cubic-bezier(.4,0,.7,.2)', fill: 'forwards' }).onfinish = limpa;
  }
  desenhaPainel(); desenhaSimular(); marcaHash();
};
const ir = (nome, { pilha = true, volta = false } = {}) => {
  if (!TELAS[nome]) return toast('Tela fora do protótipo.');
  if (FOLHAS_APP[nome]) return abreSheet(nome);
  if (estado.folha) fechaSheet(true);
  // a screen that is not in the current flow moves the panel to a flow that has it
  const f = FLUXOS[estado.fluxo];
  const tem = fl => fl.passos.some(p => p[0] === nome) || (fl.filhas && fl.filhas[nome]);
  if (!tem(f)) { const j = FLUXOS.findIndex(tem); if (j >= 0) { estado.fluxo = j; desenhaFluxos(); } }
  // going to a screen already behind us (saving a sheet, saving a partner) rewinds the history to it
  const k = estado.pilha.lastIndexOf(nome);
  if (pilha && k >= 0) { estado.pilha.length = k; volta = true; }
  else if (pilha && estado.tela && estado.tela !== nome) estado.pilha.push(estado.tela);
  estado.tela = nome;
  fechaFolha(); limpaTimers();
  const t = TELAS[nome];
  telasEl.innerHTML = '<div class="tela' + (volta ? ' volta' : '') + '" style="background: ' + t.fundo + '">' + t.corpo + '</div>';
  telasEl.scrollTop = 0;
  prepara(telasEl.firstElementChild, nome);
  desenhaPainel(); desenhaSimular(); marcaHash();
};

// ---------- make a screen live
const estiloChip = (b, on) => {
  b.setAttribute('aria-pressed', on);
  Object.assign(b.style, on
    ? { border: '1.5px solid #338449', background: '#DDEFE3', color: '#1F5F35', boxShadow: 'none' }
    : { border: '1px solid #DCE1DE', background: '#FFFFFF', color: '#3E4541', boxShadow: '0 1px 2px rgba(17,21,19,0.04)' });
};
const estiloSwitch = (b, on) => {
  b.setAttribute('aria-checked', on);
  const trilho = b.firstElementChild, bola = trilho && trilho.firstElementChild;
  if (!trilho || !bola) return;
  trilho.style.background = on ? '#338449' : '#D5DAD7';
  bola.style.left = '3px'; bola.style.right = 'auto'; bola.style.transform = on ? 'translateX(20px)' : 'none';
};
const switchPor = rot => telasEl.querySelector('[role="switch"][aria-label="' + rot + '"]');
const alternaSwitch = rot => { const s = switchPor(rot); if (s) s.click(); };
const campoPor = rot => telasEl.querySelector('.pc-campo[data-rot="' + rot + '"]');
const PH = { 'Nome completo': 'Como está no documento', 'Data de nascimento': 'DD/MM/AAAA', 'Celular': '(00) 00000-0000', 'E‑mail': 'seu@email.com', 'E&#8209;mail': 'seu@email.com', 'Nome do contato': 'Quem a gente procura', 'Telefone': '(00) 0000-0000' };
const esvazia = (rots, vazio) => rots.forEach(r => { const c = campoPor(r); if (!c) return; const i = c.querySelector('input'); if (!i) return; i.value = vazio ? '' : (i.dataset.v || ''); if (vazio) i.placeholder = PH[r] || ''; });
const aplicaRevela = tela => tela.querySelectorAll('[data-quando]').forEach(el => {
  const [rot, quer] = el.dataset.quando.split('|'); const s = tela.querySelector('[role="switch"][aria-label="' + rot + '"]');
  if (s) el.hidden = (s.getAttribute('aria-checked') === 'true') !== (quer === 'on');
});
const confereObrigatorios = tela => {
  const falta = [...tela.querySelectorAll('.pc-check[data-obrigatorio]')].some(c => c.dataset.on !== '1');
  const cta = ultimoCta(tela); if (cta && !cta.hasAttribute('data-desligado')) cta.classList.toggle('desligado', falta);
};
const ultimoCta = tela => { const r = [...tela.children].reverse().find(k => k.style.position === 'sticky'); return r && r.querySelector('a[href]'); };

function prepara(tela, nome) {
  // the fixed footer of the board becomes sticky at the bottom of the scrolling screen
  [...tela.children].forEach(k => { if (k.style.position === 'absolute' && k.style.bottom === '0px' && /linear-gradient/.test(k.style.background)) Object.assign(k.style, { position: 'sticky', left: '', right: '', marginTop: 'auto', zIndex: 5 }); });
  raizEl.style.setProperty('--status-cor', nome === 'PaySelfieCamera' ? '#FFFFFF' : '#111513');
  raizEl.style.setProperty('--status-fundo', TELAS[nome].fundo);
  raizEl.classList.remove('rolou');
  tela.querySelectorAll('select.pc-input').forEach(s => { const f = () => s.classList.toggle('vazio', !s.value); f(); s.addEventListener('change', f); });
  tela.querySelectorAll('[data-desligado]').forEach(a => a.classList.add('desligado'));
  // screen rules
  if (nome === 'PayPfDados' && !estado.usarDados) {
    esvazia(['Nome completo', 'Data de nascimento', 'Celular', 'E‑mail'], true);
    const aviso = [...tela.querySelectorAll('[role="note"]')].find(n => /Trouxemos/.test(n.textContent)); if (aviso) aviso.style.display = 'none';
  }
  if (nome === 'PayTitularCpf') { const s = tela.querySelector('[role="switch"][aria-label="Usar meus dados do app"]'); if (s) estiloSwitch(s, estado.usarDados); }
  if (nome === 'PaySelfieCamera') camera(tela);
  aplicaRevela(tela); confereObrigatorios(tela);
}

// once the screen scrolls, the status bar gets the screen's background so text never runs under the clock
telasEl.addEventListener('scroll', () => raizEl.classList.toggle('rolou', telasEl.scrollTop > 4), { passive: true });
// clicks inside the phone
const trataClique = e => {
  // the dim layer behind an app sheet closes it
  if (estado.folha && e.target === appEl.firstElementChild) return fechaSheet();
  const tela = telasEl.firstElementChild;
  const sw = e.target.closest('[role="switch"]');
  if (sw) {
    const on = sw.getAttribute('aria-checked') !== 'true'; estiloSwitch(sw, on);
    const rot = sw.getAttribute('aria-label');
    if (rot === 'Usar meus dados do app') estado.usarDados = on;
    if (rot === 'Eu sou o contato') esvazia(['Nome do contato', 'Telefone', 'E‑mail'], !on);
    aplicaRevela(tela); return;
  }
  const chip = e.target.closest('[role="radiogroup"] button[aria-pressed]');
  if (chip) { chip.closest('[role="radiogroup"]').querySelectorAll('button[aria-pressed]').forEach(b => estiloChip(b, b === chip)); return; }
  const chk = e.target.closest('.pc-check');
  if (chk) {
    e.preventDefault(); chk.dataset.on = chk.dataset.on === '1' ? '0' : '1';
    if (/Não consta/.test(chk.textContent)) { const c = campoPor('Nome da mãe'); if (c) { const i = c.querySelector('input'), cx = c.querySelector('.pc-caixa'); const on = chk.dataset.on === '1'; i.disabled = on; if (on) { i.value = ''; i.placeholder = 'Não consta no documento'; } else i.placeholder = 'Como está no documento'; cx.classList.toggle('apagado', on); } }
    confereObrigatorios(tela); return;
  }
  const a = e.target.closest('a[href]');
  if (a) {
    e.preventDefault();
    if (a.classList.contains('desligado')) return;
    let alvo = a.getAttribute('href').replace('.dc.html', '');
    const f = FLUXOS[estado.fluxo].id;
    if (estado.tela === 'PayPjSocioPf' && alvo === 'PayPjSocios' && f === 'semAdm') { const s = switchPor('É administrador(a)'); if (!s || s.getAttribute('aria-checked') !== 'true') alvo = 'PayPjSociosSemAdm'; }
    if (estado.tela === 'PayTitularCnpj' && alvo === 'PayPjEmpresa' && f === 'jaTem') alvo = 'PayJaTemConta';
    if (estado.tela === 'PaySelfieCamera' && alvo === 'PayTitularCpf') alvo = titularDoFluxo();
    if (a.getAttribute('aria-label') === 'Voltar' && estado.pilha.length && estado.pilha[estado.pilha.length - 1] === alvo) return voltar();
    // closing or saving a sheet back onto its own screen just slides it down
    if (estado.folha && alvo === FOLHAS_APP[estado.folha]) return fechaSheet();
    if (alvo === estado.tela) return;
    if (alvo === 'PayInicio' && /Enviado/.test(estado.tela)) return comecaFluxo(estado.fluxo);
    return ir(alvo);
  }
  const acao = e.target.closest('[data-acao="pep"]');
  if (acao) return abreFolha('pep');
  const b = e.target.closest('button');
  if (b && !b.closest('label')) toast('Ação fora deste protótipo.');
};
telasEl.addEventListener('click', trataClique);
appEl.addEventListener('click', trataClique);

// ---------- selfie: the ring of ticks fills while the face holds still, then the photo is taken
const titularDoFluxo = () => FLUXOS[estado.fluxo].passos.some(p => p[0] === 'PayTitularCnpj') ? 'PayTitularCnpj' : 'PayTitularCpf';
function camera(tela) {
  const linhas = [...tela.querySelectorAll('svg line')], pilula = tela.querySelector('[role="status"]');
  const texto = t => { if (pilula) pilula.lastChild.textContent = t; };
  linhas.forEach(l => l.setAttribute('stroke', 'rgba(255,255,255,0.3)'));
  texto('Centralize o rosto no círculo');
  depois(900, () => {
    texto('Segure firme, quase lá');
    linhas.forEach((l, i) => depois(i * 24, () => l.setAttribute('stroke', '#5BE38A')));
    depois(linhas.length * 24 + 150, () => { texto('Pronto, foto tirada'); depois(800, () => ir(titularDoFluxo())); });
  });
}
